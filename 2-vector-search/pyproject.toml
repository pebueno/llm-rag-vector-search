[project]
name = "llm-zoomcamp-2-vector-search"
version = "0.1.0"
description = "LLM Zoomcamp 2026, Module 2: vector search with embeddings, sqlitesearch and pgvector"
readme = "README.md"
authors = [
    { name = "Pedro Ivo Bueno Sartório", email = "pedroivobu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "minsearch>=0.2.0",
    "numpy>=2.5.5",
    "openai>=3.58.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.28.1",
    "sentence-transformers>=6.3.0",
    "sqlitesearch>=0.3.0",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

# CPU-only PyTorch: the default wheel pulls several GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
