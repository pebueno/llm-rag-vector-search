[project]
name = "llm-zoomcamp-4-evaluation"
version = "0.1.0"
description = "LLM Zoomcamp 2026, Module 4: search and RAG evaluation (Hit Rate, MRR, LLM-as-a-judge)"
readme = "README.md"
authors = [
    { name = "Pedro Ivo Bueno Sartório", email = "pedroivobu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "minsearch>=0.2.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "openai>=3.58.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tokenizers>=0.23.3",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
    "jupyter>=1.1.1",
]
